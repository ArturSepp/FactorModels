# SHARED CI CORE v1.0 — T1 — synced 2026-10-22
name: CI
run-name: ${{ github.event_name == 'schedule' && 'Dependency compatibility (live resolution)' || 'CI' }}

permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12", primary: true}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Sync the test environment
      # Primary cell installs uv.lock exactly; floating cells test today's resolution.
      # Retried because observed failures here are transport failures, not test failures.
      shell: bash
      run: |
        sync_cmd=(uv sync --group test --group lint ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }})
        for attempt in 1 2 3; do
          if "${sync_cmd[@]}"; then exit 0; fi
          if [ "$attempt" -eq 3 ]; then echo "::error::uv sync failed after 3 attempts"; exit 1; fi
          delay=$((attempt * 30 - 15))
          echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done

    - name: Verify imports
      run: |
        uv run --no-sync python -c "
        from pathlib import Path
        import factormodels as package
        from factormodels import (
            FactorCovarEstimator,
            infer_factor_premia,
            compute_cma_diagnostics,
            annual_arithmetic_from_log,
        )
        package_path = Path(package.__file__).resolve()
        assert package_path.parent.name == 'factormodels'
        assert package_path.parent.parent.name == 'src'
        print(package_path)
        print('All imports OK')
        "

    - name: Run tests
      run: uv run --no-sync pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.12"

    - name: Check lint and stack invariants
      run: uv run --locked --only-group lint ruff check src tests tools

  wheel:
    name: built wheel (core install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.12"

    - name: Build the wheel from the source distribution
      run: |
        uv build --sdist --clear --out-dir dist
        uv build --wheel dist/*.tar.gz --out-dir dist

    - name: Assert distribution contents
      run: |
        uv run --no-project python - <<'PY'
        import glob
        import tarfile
        import zipfile

        wheels = glob.glob("dist/*.whl")
        sdists = glob.glob("dist/*.tar.gz")
        assert len(wheels) == 1, wheels
        assert len(sdists) == 1, sdists

        wheel_names = zipfile.ZipFile(wheels[0]).namelist()
        sdist_names = tarfile.open(sdists[0]).getnames()
        assert "factormodels/__init__.py" in wheel_names
        # The shipped suite is what `pytest --pyargs factormodels` exercises from outside the checkout.
        for owner in ("analytics", "estimation", "gls_diagnostic", "reports"):
            assert any(name.startswith(f"factormodels/{owner}/tests/test_") and name.endswith(".py") for name in wheel_names), owner
        assert not any(name.startswith(("factormodels/premia/", "factormodels/cma/", "factormodels/spec/")) for name in wheel_names)
        assert not any(name.endswith("_test.py") for name in wheel_names)
        assert any(name.endswith("/src/factormodels/__init__.py") for name in sdist_names)
        assert any(name.endswith("/tools/architecture_debt.json") for name in sdist_names)
        # Examples and private working records stay outside the installed library.
        assert not any(name.startswith(("examples/", "docs/", "agents/")) for name in wheel_names), wheel_names
        forbidden = {"run_local", "agents", "__pycache__", "examples"}
        assert not any(forbidden.intersection(name.split("/")) for name in wheel_names), wheel_names
        assert not any(name.endswith((".pyc", ".pyo")) for name in wheel_names)
        assert not any("agents" in name.split("/") for name in sdist_names)
        PY

    - name: Install the wheel into a clean environment
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/wheelcheck-venv"
        uv pip install --python "$RUNNER_TEMP/wheelcheck-venv/bin/python" \
          "$(ls dist/*.whl)" pytest

    - name: Exercise the installed wheel from outside the checkout
      working-directory: ${{ runner.temp }}
      run: |
        source "$RUNNER_TEMP/wheelcheck-venv/bin/activate"
        mkdir -p "$RUNNER_TEMP/wheelcheck"
        cd "$RUNNER_TEMP/wheelcheck"
        # pytest exits with code 5 if installed collection is empty.
        python -m pytest --collect-only --pyargs factormodels -q
        python -m pytest --pyargs factormodels -q
        python -m pytest -q \
          "$GITHUB_WORKSPACE/tests/test_examples.py" \
          "$GITHUB_WORKSPACE/tests/test_documented_contracts.py" \
          "$GITHUB_WORKSPACE/tests/test_dependency_floor.py" \
          "$GITHUB_WORKSPACE/tests/test_readme.py"
        python -c "from pathlib import Path; import factormodels as package; checkout = Path(r'${{ github.workspace }}').resolve(); package_path = Path(package.__file__).resolve(); assert checkout not in package_path.parents, package_path; print(package_path)"

  stack-policy:
    name: stack import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Exercise policy regressions
        run: python .github/scripts/check_stack_imports.py --self-test
      - name: Check stack imports and optional adapter isolation
        run: python .github/scripts/check_stack_imports.py

  lowest-dependencies:
    # Floor resolution is compatibility maintenance, not a verdict on an unrelated edit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: lowest direct dependencies (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - name: Keep the test environment outside the checkout
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/lowest-dependencies" >> "$GITHUB_ENV"
      - name: Resolve a fresh lowest-direct test environment
        # Upgrade ignores lockfile preference; this job never commits its experimental lock.
        run: uv sync --python 3.11 --resolution lowest-direct --upgrade --group test --group lint
      - name: Record installed versions
        run: uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Check optional dependencies stay outside package-root import
        run: uv run --no-sync python .github/scripts/check_stack_imports.py --check-root
      - name: Test declared dependency floors
        run: uv run --no-sync pytest
