name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MPLBACKEND: Agg
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group test --group lint
      - run: uv run --no-sync ruff check src tests tools
      - run: uv run --no-sync pytest
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'
      - run: uv sync --locked --group test
      - run: uv run --no-sync python -m build
      - name: Verify installed artifact outside checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/tf-wheel"
          uv pip install --python "$RUNNER_TEMP/tf-wheel/bin/python" dist/*.whl pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tf-wheel/bin/python" -m pytest --pyargs tradablefactors
