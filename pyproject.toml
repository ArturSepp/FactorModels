[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factormodels"
version = "0.1.1"
description = "Factor construction, GLS premia, capital market assumptions and factor covariance estimation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Artur Sepp", email = "artursepp@gmail.com"}]
keywords = [
    "MATF", "multi-asset", "tradable-factors", "factor-models",
    "covariance-estimation", "capital-market-assumptions", "generalized-least-squares",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    # Pillow 13 fixes the image-processing advisories affecting earlier releases.
    "pillow>=13.0.0",
    "qis>=5.38.1",
    "factorlasso>=1.0.4.post1",
]

[project.optional-dependencies]
docs = ["sphinx>=7.2", "myst-parser>=2.0", "furo>=2024.1.29"]

[project.urls]
Homepage = "https://github.com/ArturSepp/FactorModels"
Documentation = "https://github.com/ArturSepp/FactorModels/blob/main/docs/index.md"
Repository = "https://github.com/ArturSepp/FactorModels"
Issues = "https://github.com/ArturSepp/FactorModels/issues"
Changelog = "https://github.com/ArturSepp/FactorModels/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=4", "build>=1.2", "packaging>=24"]
lint = ["ruff==0.16.9", "interrogate==1.7.0", "deptry==0.25.1"]

[tool.setuptools.package-data]
factormodels = ["settings.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["factormodels*"]
exclude = ["*.run_local", "*.run_local.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/factormodels"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "TID251", "TID253", "ICN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# The frozen cross-package replay harness is development tooling, not FM library code.
"tools/replay_reference.py" = ["TID251"]
"examples/downstream_handoff.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"optimalportfolios" = {msg = "FactorModels supplies risk inputs to optimisers; it does not import them."}
"ramen" = {msg = "Application-specific bindings remain in downstream consumers."}
"privateassets" = {msg = "PrivateAssets consumes statistical outputs independently."}
"bbg_fetch" = {msg = "Market-data acquisition is outside the core factor-model package."}
"trendfollowing" = {msg = "Use the declared QIS/FactorLasso numerical interfaces."}
"stochvolmodels" = {msg = "Option pricing is outside factor-model ownership."}
"vanilla_option_pricers" = {msg = "Option pricing is outside factor-model ownership."}
"option_chain_analytics" = {msg = "Option-chain analytics is outside factor-model ownership."}
"goal_based_allocation" = {msg = "Goal-based allocation consumes supplied models."}

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"
"matplotlib.pyplot" = "plt"

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = true
ignore-private = true
ignore-semiprivate = true
exclude = ["agents", "tests", "tools", "docs", "build"]

[tool.deptry]
known_first_party = ["factormodels"]

[tool.deptry.per_rule_ignores]
# Rendering is delegated to QIS; Sphinx and its extensions are build-time tools.
# Pillow is an explicit security floor for the transitive rendering dependency.
DEP002 = ["matplotlib", "pillow", "sphinx", "myst-parser", "furo"]
# Source-adjacent tests are shipped for the explicit installed-wheel test command.
DEP004 = ["pytest"]
